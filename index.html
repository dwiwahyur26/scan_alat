<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Barcode Alat (ZXing)</title>
  <!-- MEMANGGIL LIBRARY PUSAT ZXING-JS RESMI & TERBARU -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #F5F5F5; text-align: center; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; }
    h2 { color: #2F52CD; margin-bottom: 5px; }
    input[type="text"] { width: 80%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; box-sizing: border-box; }
    .status { color: #2F52CD; font-weight: bold; margin-top: 15px; font-size: 16px; min-height: 24px; }
    .btn-scan { background-color: #2F52CD; color: white; padding: 14px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 80%; margin-top: 10px; display: inline-block; }
    #hidden-input { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>PEMAKAIAN ALAT</h2>
  <p style="font-family: monospace; font-weight: bold; color: #555;">Powered by ZXing-JS</p>
  
  <input type="text" id="username" placeholder="Input your name">
  <button class="btn-scan" onclick="pemicuKameraHP()">📷 Ambil Foto Barcode</button>
  
  <!-- Kamera Bawaan Sistem HP (100% Lolos Blokir Keamanan Browser) -->
  <input type="file" id="hidden-input" accept="image/*" capture="environment" onchange="prosesGambarZXing(event)">
  
  <div id="status-pesan" class="status"></div>
</div>

<script>
  // URL exec Apps Script Anda yang valid
  const URL_APPS_SCRIPT = "https://google.com";

  function pemicuKameraHP() {
    let namaUser = document.getElementById("username").value;
    if (!namaUser) {
      alert("Isi Nama Pengguna Terlebih Dahulu!");
      return;
    }
    document.getElementById("hidden-input").click();
  }

  function prosesGambarZXing(event) {
    let namaUser = document.getElementById("username").value;
    
    if (event.target.files.length === 0) return;
    const file = event.target.files[0]; // Mengambil file foto murni yang dijepret

    document.getElementById("status-pesan").innerText = "ZXing sedang membaca barcode...";

    // 1. Mengubah file gambar jepretan kamera menjadi URL objek sementara di browser
    const pembuatUrlGambar = URL.createObjectURL(file);

    // 2. Menginisialisasi Mesin Pembaca Multi-Format milik ZXing-JS
    const pembacaZxing = new ZXing.BrowserMultiFormatReader();

    // 3. Menjalankan fungsi dekode mandiri berbasis URL gambar jepretan
    pembacaZxing.decodeFromImageUrl(pembuatUrlGambar)
      .then(result => {
        // Jika ZXing berhasil mendeteksi Barcode/QR Code
        const teksBarcode = result.text;
        document.getElementById("status-pesan").innerText = "Sedang mencatat data...";

        // Kirim hasil teks ke Google Sheets via Fetch API
        fetch(`${URL_APPS_SCRIPT}?id_alat=${encodeURIComponent(teksBarcode)}&user=${encodeURIComponent(namaUser)}`)
          .then(response => response.text())
          .then(responseText => {
             document.getElementById("status-pesan").innerText = responseText;
             alert(responseText);
             bersihkanInput();
          })
          .catch(error => {
             document.getElementById("status-pesan").innerText = "Gagal mengirim data ke Sheets!";
             console.error(error);
             bersihkanInput();
          });
      })
      .catch(err => {
        // Jika gambar buram, tidak fokus, atau bukan gambar barcode
        document.getElementById("status-pesan").innerText = "Barcode tidak terbaca! Pastikan foto lurus dan fokus.";
        alert("ZXing gagal mendeteksi kode. Tips: Ambil foto barcode dari jarak sekitar 20cm (jangan terlalu dekat agar tidak buram) dan pastikan pencahayaannya terang!");
        bersihkanInput();
        console.error("Detail Eror ZXing:", err);
      });

    // Fungsi pembersihan memori objek setelah selesai digunakan
    function bersihkanInput() {
      URL.revokeObjectURL(pembuatUrlGambar); // Menghapus URL objek sementara dari memori browser
      document.getElementById("hidden-input").value = ""; // Mengosongkan pemicu kamera
    }
  }
</script>
</body>
</html>
